name = "vanta-central-auth"
main = "src/index.js"
compatibility_date = "2026-11-01"

[vars]
# Replace with the exact published Vanta Central website origin.
APP_ORIGIN = "https://YOUR-GITHUB-USERNAME.github.io"
# Full published GitHub Pages URL, including the repository path if this is a project site.
APP_URL = "https://YOUR-GITHUB-USERNAME.github.io/YOUR-REPOSITORY/"
# Discord Application > OAuth2 > Client ID (public identifier, not a secret).
DISCORD_CLIENT_ID = "1563889602559873136"
# Vanta Designs Discord server ID.
VANTA_GUILD_ID = "1564583995839217674"

[[d1_databases]]
binding = "DB"
database_name = "vanta-central-accounts"
database_id = "c3e14be4-764a-4589-b3a7-c42e55f57ab5"

# Add these as encrypted Worker secrets, never in this file:
# npx wrangler secret put DISCORD_CLIENT_SECRET
# npx wrangler secret put DISCORD_BOT_TOKEN
# npx wrangler secret put SESSION_SECRET
